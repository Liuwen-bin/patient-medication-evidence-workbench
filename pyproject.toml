[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medication-review-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=2.0,<4.0",
  "langchain-openai>=1.0,<2.0",
  "mcp>=1.29,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "httpx>=0.27,<1.0",
  "playwright>=1.50,<2.0",
  "pytest-playwright>=0.7,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
medication-review-api = "medication_review_agent.api:main"
medication-review-evaluate = "medication_review_agent.evaluation:main"
medication-review-evaluate-online = "medication_review_agent.online_evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
